[project]
name = "financial-health-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Diaz", email = "danidsanj@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
financial-health-app = "financial_health_app:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
